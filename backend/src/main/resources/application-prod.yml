spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/campus_presence}
    username: ${POSTGRES_USER:campus}
    password: ${POSTGRES_PASSWORD:campus}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  seed-demo: ${APP_SEED_DEMO:false}
